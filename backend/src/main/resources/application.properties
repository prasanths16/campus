spring.application.name=campus-backend

# Aiven Cloud MySQL DataSource Configuration with SSL and Asia/Kolkata timezone
spring.datasource.url=jdbc:mysql://${DB_HOST:campus-mysql-campus-project.h.aivencloud.com}:${DB_PORT:28405}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:VERIFY_CA}&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL:}&trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD:changeit}&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# HikariCP Connection Pool Configuration (prevents connection drops, cold start timeouts, and maintains warm connections)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000