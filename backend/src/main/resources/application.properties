spring.application.name=campus-backend

# Aiven Cloud MySQL DataSource Configuration with SSL (CA verification)
spring.datasource.url=jdbc:mysql://${DB_HOST:campus-mysql-campus-project.h.aivencloud.com}:${DB_PORT:28405}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:VERIFY_CA}&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL}&trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD:changeit}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true